name: llmpatients-app

services:
  app:
    profiles:
      - app
    image: ${LLMPATIENTS_APP_IMAGE:-llmpatients-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      AUTH_SECRET: ${AUTH_SECRET:-local-docker-auth-secret-change-me-abcdefghijklmnopqrstuvwxyz}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-docker-nextauth-secret-change-me-abcdefghijklmnopqrstuvwxyz}
      JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-secret-change-me-abcdefghijklmnopqrstuvwxyz}
      NEXTAUTH_URL: http://localhost:${LLMPATIENTS_APP_PORT:-8080}
      API: ${API:-local}
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8000}
      EXTERNAL_AI_API_KEY: ${EXTERNAL_AI_API_KEY:-}
      API_INITIALIZE_PATIENT_ENDPOINT: ${API_INITIALIZE_PATIENT_ENDPOINT:-/patients}
      API_CHAT_RESPONSE_ENDPOINT: ${API_CHAT_RESPONSE_ENDPOINT:-/chat-response}
      API_SESSION_END_ENDPOINT: ${API_SESSION_END_ENDPOINT:-/session-end}
      API_TIMEOUT_INITIALIZE_PATIENT: ${API_TIMEOUT_INITIALIZE_PATIENT:-120000}
      API_TIMEOUT_CHAT_RESPONSE: ${API_TIMEOUT_CHAT_RESPONSE:-120000}
      API_TIMEOUT_GENERATE_RESPONSE: ${API_TIMEOUT_GENERATE_RESPONSE:-120000}
      API_TIMEOUT_SESSION_END: ${API_TIMEOUT_SESSION_END:-120000}
      TTS_PROVIDER: ${TTS_PROVIDER:-none}
      VERTEX_MODEL_ID: ${VERTEX_MODEL_ID:-gemini-2.5-flash}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-true}
    ports:
      - "${LLMPATIENTS_APP_PORT:-8080}:8080"

  # PostgreSQL database
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./pg__data:/var/lib/postgresql
      #- ./pg_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 20s
      timeout: 10s
      retries: 5
